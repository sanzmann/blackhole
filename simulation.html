<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블랙홀 시뮬레이션 | 블랙홀 시뮬레이터</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/simulation.css">
</head>
<body>
  <!-- 시뮬레이션 화면 전체 (js/simulation.js) -->
  <canvas id="sim"></canvas>

  <!-- ===== 1. 시작 패널: 어떻게 즐길지 고른다 ===== -->
  <section id="setup" class="setup">
    <div class="setup-card">
      <a href="index.html" class="back">← 처음으로</a>
      <h1>블랙홀 시뮬레이션</h1>
      <p class="desc">블랙홀에 이름을 붙이고, 어떻게 즐길지 골라 주세요.</p>

      <h2 class="label">블랙홀 이름</h2>
      <input id="nameInput" class="name-input" type="text" maxlength="20" placeholder="이름 없는 블랙홀">

      <div class="mode-options">
        <button id="playBtn" class="mode-card" type="button">
          <i>🕳️</i>
          <span>
            <b>블랙홀 조종하기</b>
            <small>도시 한복판에 떨어진 블랙홀을 직접 움직여, 도시부터 우주 전체까지 삼켜 보세요.</small>
          </span>
        </button>
        <button id="observeBtn" class="mode-card" type="button">
          <i>🔭</i>
          <span>
            <b>우주 관측하기</b>
            <small>도시를 건너뛰고 바로 태양계로. 블랙홀을 던지고, 시점을 움직이며 우주 끝까지 둘러보세요.</small>
          </span>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== 2. 시뮬레이션 계기판 ===== -->
  <div id="hud" class="hud hidden">
    <div class="panel hud-info">
      <div class="hud-name" id="hudName"></div>
      <div class="hud-place" id="hudPlace"></div>
      <div class="hud-stage" id="hudStage"></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>

    <div class="panel hud-size">
      <div class="hud-label">블랙홀 크기</div>
      <div class="hud-big" id="hudSize">-</div>
      <div class="hud-label">경과 시간</div>
      <div class="hud-time" id="hudTime">00:00</div>
    </div>

    <div class="panel hud-eaten">
      <div class="hud-label">삼킨 것</div>
      <ul id="eatenList"></ul>
    </div>

    <div class="hud-controls">
      <button id="pauseBtn" type="button" title="일시정지 (스페이스바)">⏸</button>
      <button id="speedBtn" type="button" title="속도">×1</button>
      <button id="soundBtn" type="button" title="소리">🔊</button>
      <a href="index.html" title="처음으로">🏠</a>
    </div>

    <p class="hint" id="hint"></p>
  </div>

  <!-- ===== 태양계 시뮬레이터 조작 패널 (js/solarsim.js) ===== -->
  <div id="simPanel" class="sim-panel hidden">
    <div class="sim-row">
      <span class="sim-label">블랙홀 질량</span>
      <div id="simMass" class="sim-mass"></div>
    </div>
    <div class="sim-row">
      <span class="sim-label">시간</span>
      <button id="simSlower" type="button">−</button>
      <span id="simSpeed" class="sim-speed"></span>
      <button id="simFaster" type="button">+</button>
      <span id="simYear" class="sim-year">0.0년</span>
      <button id="simReset" type="button">↺ 처음부터</button>
      <button id="simNext" type="button" class="sim-next">다음 단계 →</button>
    </div>
    <div class="sim-row">
      <span class="sim-label">보기</span>
      <button id="simZoomOut" type="button" title="축소 (마우스 휠, − 키)">🔭 −</button>
      <button id="simZoomIn" type="button" title="확대 (마우스 휠, + 키)">🔍 +</button>
      <button id="simRealSize" type="button">실제 크기</button>
      <span class="sim-label">따라가기</span>
      <button id="simFocusPrev" type="button" title="이전 천체">◀</button>
      <span id="simFocusName" class="sim-speed">태양</span>
      <button id="simFocusNext" type="button" title="다음 천체">▶</button>
    </div>
    <div class="sim-row">
      <span class="sim-label">이동</span>
      <button id="simJumpSolar" type="button">🪐 태양계</button>
      <button id="simJumpGalaxy" type="button">🌌 우리 은하</button>
      <button id="simJumpUniverse" type="button">🌐 우주 끝</button>
      <button id="simAstro" type="button" disabled>🧑‍🚀 우주인 되기</button>
    </div>
  </div>
  <div id="simLog" class="sim-log hidden"></div>

  <!-- ===== 지구 단계 조작 패널 (js/earthsim.js) ===== -->
  <div id="earthPanel" class="sim-panel hidden">
    <div class="sim-row">
      <span class="sim-label">보기</span>
      <button id="earthZoomOut" type="button" title="축소 (마우스 휠)">🔭 −</button>
      <button id="earthZoomIn" type="button" title="확대 (마우스 휠)">🔍 +</button>
      <button id="earthNext" type="button" class="sim-next" disabled>다음 단계 →</button>
    </div>
  </div>

  <!-- 해설 문구, 단계 제목 -->
  <div id="narration" class="narration"></div>
  <div id="stageTitle" class="stage-title">
    <small id="stageTitleSmall"></small>
    <strong id="stageTitleBig"></strong>
  </div>

  <!-- ===== 3. 엔딩 ===== -->
  <section id="ending" class="ending hidden">
    <div class="ending-card">
      <p class="ending-small">태양계를 모두 휩쓸었습니다</p>
      <h1>TO BE CONTINUED</h1>
      <p class="ending-next">다음 이야기: 은하, 우주, 그리고 그 너머 (준비 중)</p>
      <p class="ending-result" id="endingResult"></p>

      <h2>내 블랙홀 기록</h2>
      <ol id="recordList" class="record-list"></ol>

      <div class="ending-buttons">
        <button id="restartBtn" type="button" class="install-btn">다시 하기</button>
        <a href="index.html" class="ghost-btn">처음으로</a>
      </div>
    </div>
  </section>

  <script src="js/simulation.js"></script>
  <script src="js/citysim.js"></script>
  <script src="js/earthsim.js"></script>
  <script src="js/solarsim.js"></script>
</body>
</html>
